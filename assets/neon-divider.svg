<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 12" width="100%" height="12">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0" />
      <stop offset="25%" stop-color="#059669" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="75%" stop-color="#059669" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    @keyframes slideLaser {
      0% { transform: translateX(-350px); opacity: 0.3; }
      50% { opacity: 1; }
      100% { transform: translateX(350px); opacity: 0.3; }
    }
    .laser-node { animation: slideLaser 4s ease-in-out infinite alternate; }
  </style>
  <line x1="20" y1="6" x2="880" y2="6" stroke="url(#lineGrad)" stroke-width="1.5" />
  <g class="laser-node">
    <rect x="420" y="4.5" width="60" height="3" rx="1.5" fill="#34D399" />
    <circle cx="450" cy="6" r="3" fill="#A7F3D0" />
  </g>
</svg>
