<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="borderEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes blipPing {
      0% { r: 2; opacity: 1; }
      70% { r: 9; opacity: 0; }
      100% { r: 2; opacity: 0; }
    }
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.12; }
      50% { opacity: 0.25; }
      100% { transform: translateY(250px); opacity: 0.12; }
    }
    @keyframes fadeSlide1 {
      0%, 10% { opacity: 0; transform: translateX(-6px); }
      20%, 90% { opacity: 1; transform: translateX(0); }
      100% { opacity: 0.9; }
    }
    @keyframes fadeSlide2 {
      0%, 30% { opacity: 0; transform: translateX(-6px); }
      40%, 90% { opacity: 1; transform: translateX(0); }
      100% { opacity: 0.9; }
    }
    @keyframes fadeSlide3 {
      0%, 50% { opacity: 0; transform: translateX(-6px); }
      60%, 90% { opacity: 1; transform: translateX(0); }
      100% { opacity: 0.9; }
    }
    @keyframes fadeSlide4 {
      0%, 70% { opacity: 0; transform: translateX(-6px); }
      80%, 95% { opacity: 1; transform: translateX(0); }
      100% { opacity: 0.9; }
    }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    .radar-sweep {
      transform-origin: 735px 150px;
      animation: radarSpin 4s linear infinite;
    }
    .ping-circle { animation: blipPing 2.4s cubic-bezier(0, 0, 0.2, 1) infinite; }
    .scan-bar { animation: scanline 6s linear infinite; }
    .log-1 { animation: fadeSlide1 8s infinite; }
    .log-2 { animation: fadeSlide2 8s infinite; }
    .log-3 { animation: fadeSlide3 8s infinite; }
    .log-4 { animation: fadeSlide4 8s infinite; }
  </style>

  <!-- Outer Frame -->
  <rect width="900" height="280" rx="16" fill="url(#bgGrad)" stroke="url(#borderEmerald)" stroke-width="1.5" />

  <!-- Subtle Grid Lines -->
  <g stroke="#1E293B" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="70" x2="900" y2="70" />
    <line x1="0" y1="140" x2="900" y2="140" />
    <line x1="0" y1="210" x2="900" y2="210" />
    <line x1="300" y1="0" x2="300" y2="280" />
    <line x1="570" y1="0" x2="570" y2="280" />
  </g>

  <!-- Animated Scanline Overlay -->
  <rect class="scan-bar" x="2" y="10" width="896" height="2" fill="#10B981" />

  <!-- ========================================================= -->
  <!-- LEFT PANEL: WAZUH SIEM & SOC LIVE TERMINAL (555px wide)   -->
  <!-- ========================================================= -->
  <rect x="16" y="16" width="548" height="248" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Terminal Header -->
  <rect x="16" y="16" width="548" height="36" rx="12" fill="#090D16" />
  <line x1="16" y1="52" x2="564" y2="52" stroke="#1E293B" stroke-width="1" />
  <circle cx="34" cy="34" r="5" fill="#EF4444" />
  <circle cx="50" cy="34" r="5" fill="#F59E0B" />
  <circle cx="66" cy="34" r="5" fill="#10B981" />
  <text x="84" y="38" class="mono" font-size="11" fill="#94A3B8">nimesh895@wazuh-siem-manager:~# tail -f /var/ossec/logs/alerts.json</text>
  
  <!-- Live Badge in Terminal Header -->
  <rect x="488" y="24" width="64" height="20" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="0.8" />
  <circle class="pulse-dot" cx="500" cy="34" r="3.5" fill="#34D399" />
  <text x="509" y="38" class="mono" font-size="10" font-weight="bold" fill="#A7F3D0">LIVE</text>

  <!-- Terminal Content: Command & Animated Alert Stream -->
  <g class="mono" font-size="11.5">
    <text x="30" y="76" fill="#64748B">$ wazuh-control status &amp;&amp; soc-telemetry --watch --mitre-map</text>

    <!-- Log Entry 1 -->
    <g class="log-1">
      <rect x="30" y="88" width="520" height="32" rx="5" fill="#064E3B" fill-opacity="0.25" />
      <rect x="30" y="88" width="3" height="32" rx="1.5" fill="#10B981" />
      <text x="42" y="103" fill="#34D399" font-weight="bold">[OK] AGENT-001</text>
      <text x="150" y="103" fill="#CBD5E1">File Integrity Monitoring (FIM) active on /etc &amp; System32</text>
      <text x="42" y="116" fill="#64748B" font-size="10">Rule: 550 • Integrity Checksum Verified • Status: HARDENED</text>
    </g>

    <!-- Log Entry 2 -->
    <g class="log-2">
      <rect x="30" y="128" width="520" height="32" rx="5" fill="#7F1D1D" fill-opacity="0.25" />
      <rect x="30" y="128" width="3" height="32" rx="1.5" fill="#EF4444" />
      <text x="42" y="143" fill="#F87171" font-weight="bold">[HIGH] RULE-5716</text>
      <text x="162" y="143" fill="#E2E8F0">RDP Brute-Force Detected (Port 3389) → Active Response Drop</text>
      <text x="42" y="156" fill="#94A3B8" font-size="10">MITRE ATT&amp;CK: T1110.001 (Password Guessing) • Source IP: Quarantined</text>
    </g>

    <!-- Log Entry 3 -->
    <g class="log-3">
      <rect x="30" y="168" width="520" height="32" rx="5" fill="#78350F" fill-opacity="0.25" />
      <rect x="30" y="168" width="3" height="32" rx="1.5" fill="#F59E0B" />
      <text x="42" y="183" fill="#FBBF24" font-weight="bold">[CRIT] CVE-2022-30190</text>
      <text x="195" y="183" fill="#E2E8F0">Follina MSDT Payload Signature Matched in Sandbox</text>
      <text x="42" y="196" fill="#94A3B8" font-size="10">MITRE ATT&amp;CK: T1204.002 (Malicious File) • IoC Hash Extracted &amp; Indexed</text>
    </g>

    <!-- Log Entry 4 -->
    <g class="log-4">
      <rect x="30" y="208" width="520" height="32" rx="5" fill="#0C4A6E" fill-opacity="0.25" />
      <rect x="30" y="208" width="3" height="32" rx="1.5" fill="#38BDF8" />
      <text x="42" y="223" fill="#38BDF8" font-weight="bold">[NET] INFRA-GUARD</text>
      <text x="168" y="223" fill="#E2E8F0">Bind9 DNS, Kea DHCP &amp; Chrony NTP Services Synchronized</text>
      <text x="42" y="236" fill="#94A3B8" font-size="10">Firewall: IPTables / UFW Strict Policy • Packet Anomaly Rate: 0.00%</text>
    </g>

    <!-- Blinking Prompt -->
    <text x="30" y="255" fill="#10B981">nimesh895@soc-ops:~$ <tspan class="pulse-dot" fill="#38BDF8">█</tspan></text>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT PANEL: THREAT RADAR & TELEMETRY HUD (304px wide)    -->
  <!-- ========================================================= -->
  <rect x="580" y="16" width="304" height="248" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Radar Header -->
  <text x="600" y="42" class="mono" font-size="11" font-weight="bold" fill="#38BDF8" letter-spacing="1">THREAT RADAR // SIEM SENSOR</text>
  <text x="832" y="42" class="mono" font-size="10" fill="#10B981">ONLINE</text>
  <line x1="580" y1="52" x2="884" y2="52" stroke="#1E293B" stroke-width="1" />

  <!-- Radar Scope Center = (735, 150) -->
  <circle cx="735" cy="150" r="76" fill="url(#radarGlow)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.5" />
  <circle cx="735" cy="150" r="52" fill="none" stroke="#10B981" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.4" />
  <circle cx="735" cy="150" r="28" fill="none" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.3" />
  <line x1="659" y1="150" x2="811" y2="150" stroke="#10B981" stroke-width="0.6" stroke-opacity="0.3" />
  <line x1="735" y1="74" x2="735" y2="226" stroke="#10B981" stroke-width="0.6" stroke-opacity="0.3" />

  <!-- Rotating Radar Beam -->
  <g class="radar-sweep">
    <path d="M 735 150 L 735 74 A 76 76 0 0 1 798 108 Z" fill="#10B981" fill-opacity="0.28" />
    <line x1="735" y1="150" x2="735" y2="74" stroke="#34D399" stroke-width="1.5" />
  </g>

  <!-- Center Node -->
  <circle cx="735" cy="150" r="3.5" fill="#34D399" />

  <!-- Animated Threat Blips on Radar -->
  <circle cx="765" cy="115" r="3" fill="#EF4444" />
  <circle class="ping-circle" cx="765" cy="115" r="3" fill="none" stroke="#EF4444" stroke-width="1.5" />

  <circle cx="700" cy="130" r="2.5" fill="#38BDF8" />
  <circle cx="752" cy="182" r="2.5" fill="#F59E0B" />
  <circle class="ping-circle" cx="752" cy="182" r="2.5" fill="none" stroke="#F59E0B" stroke-width="1.2" />

  <!-- Telemetry Corner Labels -->
  <g class="mono" font-size="9.5" fill="#94A3B8">
    <text x="596" y="76">FIM: <tspan fill="#34D399">ACTIVE</tspan></text>
    <text x="596" y="92">IDS: <tspan fill="#38BDF8">SURICATA</tspan></text>
    <text x="596" y="108">SIEM: <tspan fill="#34D399">WAZUH</tspan></text>
    
    <text x="596" y="218">ATT&amp;CK: <tspan fill="#FBBF24">MAPPED</tspan></text>
    <text x="596" y="234">IOCS: <tspan fill="#F87171">TRACKED</tspan></text>
    <text x="596" y="250">LAB: <tspan fill="#34D399">VERIFIED</tspan></text>
  </g>
</svg>
