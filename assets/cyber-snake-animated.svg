<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 175" width="100%" height="175">
  <defs>
    <linearGradient id="snakeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="snakeBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', monospace; }
    @keyframes snakePathMove {
      0% { stroke-dashoffset: 1600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes eatCommit1 { 0%, 15% { fill: #34D399; } 20%, 95% { fill: #0F172A; } 100% { fill: #34D399; } }
    @keyframes eatCommit2 { 0%, 35% { fill: #10B981; } 40%, 95% { fill: #0F172A; } 100% { fill: #10B981; } }
    @keyframes eatCommit3 { 0%, 55% { fill: #34D399; } 60%, 95% { fill: #0F172A; } 100% { fill: #34D399; } }
    @keyframes eatCommit4 { 0%, 75% { fill: #10B981; } 80%, 95% { fill: #0F172A; } 100% { fill: #10B981; } }

    .snake-line {
      stroke-dasharray: 140 1460;
      animation: snakePathMove 9s linear infinite;
    }
    .eat-1 { animation: eatCommit1 9s infinite; }
    .eat-2 { animation: eatCommit2 9s infinite; }
    .eat-3 { animation: eatCommit3 9s infinite; }
    .eat-4 { animation: eatCommit4 9s infinite; }
  </style>

  <!-- Card Background -->
  <rect width="900" height="175" rx="14" fill="url(#snakeBg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Top Header -->
  <text x="24" y="28" class="mono" font-size="11" font-weight="bold" fill="#34D399">🐍 CONTRIBUTION MATRIX // AUTOMATED COMMIT SNAKE (nimesh895)</text>
  <text x="750" y="28" class="mono" font-size="10" fill="#64748B">52 WEEKS TELEMETRY</text>

  <!-- Contribution Grid Pattern (40 cols x 6 rows for crisp fit) -->
  <g transform="translate(24, 42)">
    <!-- Base Grid Rows -->
    <g fill="#0F172A" stroke="#1E293B" stroke-width="0.6">
      <!-- Using pattern of rects across 852px -->
      <pattern id="commitGrid" width="16" height="16" patternUnits="userSpaceOnUse">
        <rect width="12" height="12" rx="2.5" fill="#0F172A" stroke="#1E293B" stroke-width="0.6" />
      </pattern>
      <rect width="848" height="96" fill="url(#commitGrid)" />
    </g>

    <!-- Active Commit Cells (Emerald Shades) -->
    <g>
      <rect class="eat-1" x="32" y="16" width="12" height="12" rx="2.5" fill="#10B981" />
      <rect x="48" y="32" width="12" height="12" rx="2.5" fill="#064E3B" />
      <rect class="eat-1" x="80" y="16" width="12" height="12" rx="2.5" fill="#34D399" />
      <rect x="96" y="48" width="12" height="12" rx="2.5" fill="#047857" />
      <rect class="eat-1" x="144" y="16" width="12" height="12" rx="2.5" fill="#10B981" />
      <rect x="160" y="64" width="12" height="12" rx="2.5" fill="#064E3B" />
      <rect class="eat-2" x="208" y="48" width="12" height="12" rx="2.5" fill="#34D399" />
      <rect x="240" y="32" width="12" height="12" rx="2.5" fill="#047857" />
      <rect class="eat-2" x="272" y="48" width="12" height="12" rx="2.5" fill="#10B981" />
      <rect x="304" y="16" width="12" height="12" rx="2.5" fill="#064E3B" />
      <rect class="eat-2" x="352" y="48" width="12" height="12" rx="2.5" fill="#34D399" />
      <rect x="384" y="80" width="12" height="12" rx="2.5" fill="#047857" />
      <rect class="eat-3" x="432" y="16" width="12" height="12" rx="2.5" fill="#10B981" />
      <rect x="464" y="32" width="12" height="12" rx="2.5" fill="#047857" />
      <rect class="eat-3" x="512" y="16" width="12" height="12" rx="2.5" fill="#34D399" />
      <rect x="544" y="64" width="12" height="12" rx="2.5" fill="#064E3B" />
      <rect class="eat-3" x="592" y="64" width="12" height="12" rx="2.5" fill="#10B981" />
      <rect x="640" y="32" width="12" height="12" rx="2.5" fill="#047857" />
      <rect class="eat-4" x="672" y="64" width="12" height="12" rx="2.5" fill="#34D399" />
      <rect x="720" y="16" width="12" height="12" rx="2.5" fill="#047857" />
      <rect class="eat-4" x="752" y="32" width="12" height="12" rx="2.5" fill="#34D399" />
      <rect x="784" y="48" width="12" height="12" rx="2.5" fill="#10B981" />
      <rect class="eat-4" x="816" y="32" width="12" height="12" rx="2.5" fill="#34D399" />
    </g>

    <!-- Animated Slithering Cyber Snake Path -->
    <path class="snake-line"
      d="M 6 22 L 198 22 L 198 54 L 406 54 L 406 22 L 566 22 L 566 70 L 726 70 L 726 38 L 842 38"
      fill="none"
      stroke="url(#snakeBodyGrad)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round" />
  </g>

  <!-- Legend Footer -->
  <text x="24" y="158" class="mono" font-size="10" fill="#64748B">status: <tspan fill="#34D399">hunting_commits</tspan> • mode: <tspan fill="#38BDF8">autonomous</tspan></text>
  <g transform="translate(720, 148)">
    <text x="-34" y="10" class="mono" font-size="10" fill="#64748B">Less</text>
    <rect x="0" y="0" width="11" height="11" rx="2" fill="#0F172A" stroke="#1E293B" />
    <rect x="15" y="0" width="11" height="11" rx="2" fill="#064E3B" />
    <rect x="30" y="0" width="11" height="11" rx="2" fill="#047857" />
    <rect x="45" y="0" width="11" height="11" rx="2" fill="#10B981" />
    <rect x="60" y="0" width="11" height="11" rx="2" fill="#34D399" />
    <text x="77" y="10" class="mono" font-size="10" fill="#64748B">More</text>
  </g>
</svg>
